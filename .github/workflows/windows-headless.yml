name: Windows headless

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install GNU Make
        shell: pwsh
        run: choco install make --no-progress -y
      - name: Build and run headless tests
        shell: pwsh
        run: make -j2 VULKAN=0 all test
      - name: Exercise the project CLI and packaged runtime
        shell: pwsh
        run: pwsh -NoProfile -File tools/test-cli.ps1 -Engine build/debug-vk0/bin/CPPGameEngine.exe
